{% comment %}
Reusable primary button. Include with:
  {% include "components/button.html" with button_label="Sign In" button_type="submit" button_id="sign-in" %}
{% endcomment %}
<button
  class="btn"
  type="{{ button_type|default:"button" }}"
  id="{{ button_id }}"
  data-submit-btn
>
  <svg class="btn__spinner" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="2.5"/>
    <path d="M21 12a9 9 0 0 0-9-9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <span class="btn__label" data-btn-label>{{ button_label }}</span>
</button>
